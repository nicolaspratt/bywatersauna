<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Dark forest background -->
  <rect width="1200" height="630" fill="#2D3E35"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1C;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#2D3E35;stop-opacity:0.3" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ca5e43;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ca5e43;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad)"/>
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>

  <!-- Logo circle -->
  <circle cx="600" cy="200" r="80" fill="#ca5e43"/>
  <text x="600" y="235" font-family="'Playfair Display', serif" font-size="100" font-weight="700" fill="#FAF8F3" text-anchor="middle">B</text>

  <!-- Title -->
  <text x="600" y="350" font-family="'Playfair Display', serif" font-size="80" font-weight="700" fill="#FAF8F3" text-anchor="middle">Bywater Sauna</text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="'Inter', sans-serif" font-size="32" fill="rgba(250, 248, 243, 0.8)" text-anchor="middle">Seattle Beach Sauna Experience</text>

  <!-- Description -->
  <text x="600" y="480" font-family="'Inter', sans-serif" font-size="26" fill="rgba(250, 248, 243, 0.7)" text-anchor="middle">Heat Up. Cool Down. Repeat.</text>

  <!-- Location badge -->
  <rect x="470" y="520" width="260" height="50" rx="25" fill="rgba(202, 94, 67, 0.2)" stroke="#ca5e43" stroke-width="2"/>
  <text x="600" y="552" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#ca5e43" text-anchor="middle">4 SEATTLE LOCATIONS</text>
</svg>
