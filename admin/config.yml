# Decap CMS Configuration for Bywater Sauna
# Using GitHub backend (no Netlify required)

backend:
  name: github
  repo: nicolaspratt/bywatersauna
  branch: main
  # For GitHub Pages, you'll need to set up GitHub OAuth App:
  # https://github.com/settings/developers
  # Set Homepage URL to: https://yourusername.github.io/bywatersauna
  # Set Authorization callback URL to: https://yourusername.github.io/bywatersauna/admin/

# For local development
local_backend: true

# Media files configuration
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Collections
collections:
  # Locations
  - name: "locations"
    label: "Locations"
    folder: "_data"
    identifier_field: "name"
    extension: "json"
    format: "json"
    create: false
    editor:
      preview: false
    files:
      - label: "Locations Data"
        name: "locations"
        file: "_data/locations.json"
        fields:
          - label: "Locations"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Neighborhood", name: "neighborhood", widget: "string"}
              - {label: "Latitude", name: "lat", widget: "number", value_type: "float"}
              - {label: "Longitude", name: "lng", widget: "number", value_type: "float"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Parking Info", name: "parking", widget: "text"}
              - {label: "Session Length", name: "session_length", widget: "string"}
              - {label: "Amenities", name: "amenities", widget: "list"}
              - {label: "Best Time", name: "best_time", widget: "string"}
              - {label: "Getting There", name: "getting_there", widget: "text"}

  # About Page
  - name: "about"
    label: "About"
    files:
      - label: "About Content"
        name: "about"
        file: "_data/about.json"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Paragraph 1", name: "paragraph_1", widget: "text"}
          - {label: "Paragraph 2", name: "paragraph_2", widget: "text"}
          - {label: "Paragraph 3", name: "paragraph_3", widget: "text"}

  # Pages (if you want to manage HTML pages)
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "index.html"
        fields:
          - {label: "Title", name: "title", widget: "hidden", default: "Bywater Sauna"}
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string", hint: "Main heading on hero section"}
              - {label: "Description", name: "description", widget: "text"}
